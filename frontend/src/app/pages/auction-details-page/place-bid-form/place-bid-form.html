<form (submit)="onPlaceBid($event)"  class="flex flex-col gap-3 w-[250px]">
  <div class="form-control w-full">
    <label class="label" for="bidAmount">
      <span class="label-text font-semibold text-base">Your Bid Amount</span>
      <span class="label-text-alt text-base-content/60">
          Min.&nbsp;{{ minimumBid() | currency:'EUR':'symbol':'1.2-2' }}
        </span>
    </label>    
      <input
        id="bidAmount"
        type="number"
        [formField]="bidForm.amount"
        step="0.01"
        placeholder="0.00"
        class="grow input input-md"
        aria-label="Bid amount in euros"
      />
  </div>
  <button type="submit" class="btn text-white btn-block w-[250px]" [class]="disablePlacingBid() ? '' : 'btn-success'" [disabled]="disablePlacingBid()">
    <div class="flex justify-between">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="m5.25 4.5 7.5 7.5-7.5 7.5m6-15 7.5 7.5-7.5 7.5" />
      </svg>
      <span class="ms-1">Place Bid</span>
    </div>  
  </button>
</form>
@if(confirmBid()) {
  <app-confirm-modal 
    [title]="confirmBid()!.title"
    [message]="confirmBid()!.message"
    [messageHtml]="confirmBid()!.messageHtml"
    [additionalText]="confirmBid()!.additionalText"
    [cancelText]="confirmBid()!.cancelText"
    [confirmText]="confirmBid()!.confirmText"
    (confirm)="execConfirmBid($event)"
  />
}
